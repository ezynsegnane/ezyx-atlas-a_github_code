# All 30 training runs were executed on CPU only (no CUDA/GPU).
# The pytorch=2.3.1 package from the pytorch channel is CPU-only on Windows
# when no CUDA toolkit is installed. If you are on a GPU machine, add
# cpuonly to the dependencies list to force the CPU build.
name: eznx-atlas-a
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11.7
  - numpy=1.26.4
  - pandas=2.2.3
  - pyarrow=23.0.1
  - scikit-learn=1.3.2
  - scipy=1.16.3
  - tqdm=4.67.3
  - wfdb=4.3.0
  - pytorch=2.3.1
  - cpuonly
  - pip
